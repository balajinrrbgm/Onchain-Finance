  <!-- Wordmark -->
  <text x="90" y="38" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#0F172A">Afri
    <tspan fill="#0F766E">Asset</tspan>
